<div class="perfil" data-testid="perfil">
  <header class="encabezado">
    <h1>Tu perfil</h1>
    <p class="lectura">
      Declara cómo juegas para ajustar la estimación. Es opcional: sin perfil, NexPlay usa un perfil neutro y la ficha
      lo dice.
    </p>
    @if (resumen(); as texto) {
      <p class="meta activo" data-testid="perfil-resumen">{{ texto }}</p>
    }
  </header>

  <app-tarjetas-opcion
    nombre="biblioteca"
    etiqueta="Tu biblioteca de Steam"
    [opciones]="biblioteca"
    [valor]="valores().biblioteca"
    (valorCambio)="cambiar('biblioteca', $event)"
  />

  <app-tarjetas-opcion
    nombre="horas"
    etiqueta="Horas por semana disponibles para jugar"
    [opciones]="horas"
    [valor]="valores().horas"
    (valorCambio)="cambiar('horas', $event)"
  />

  <app-tarjetas-opcion
    nombre="friccion"
    etiqueta="Tolerancia a la fricción"
    ayuda="Bugs, curva de aprendizaje, dificultad."
    [opciones]="friccion"
    [valor]="valores().friccion"
    (valorCambio)="cambiar('friccion', $event)"
  />

  <app-tarjetas-opcion
    nombre="plataforma"
    etiqueta="Plataforma"
    ayuda="El catálogo de NexPlay es solo de juegos de Steam. En otra plataforma, el lado del juego transfiere, pero no hay una fuente de entrenamiento propia: la ficha lo aclara."
    [opciones]="plataformas"
    [valor]="valores().plataforma"
    (valorCambio)="cambiarPlataforma($event)"
  />

  <app-selector-generos
    [generos]="catalogo.generos()"
    [elegidos]="valores().generos"
    (alternar)="alternarGenero($event)"
  />

  @if (error()) {
    <p class="error" role="alert" data-testid="perfil-error">{{ error() }}</p>
  }

  <div class="acciones">
    <button type="button" class="boton-cta" data-testid="crear-perfil" [disabled]="guardando()" (click)="crear()">
      {{ guardando() ? 'Creando…' : perfil.hayPerfil() ? 'Actualizar perfil' : 'Crear perfil' }}
    </button>
    <a class="boton-fantasma" routerLink="/">Saltar y explorar juegos</a>
    @if (perfil.hayPerfil()) {
      <button type="button" class="boton-fantasma" data-testid="borrar-perfil" (click)="borrar()">Borrar perfil</button>
    }
  </div>
</div>
