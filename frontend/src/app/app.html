<div class="armazon" [class.barra-corta]="!barra.expandida()">
  <app-barra-lateral />

  <div class="columna">
    <header class="barra-movil">
      <button
        #hamburguesa
        type="button"
        class="hamburguesa"
        data-testid="abrir-menu"
        aria-label="Menú"
        aria-controls="riel"
        [attr.aria-expanded]="barra.cajonAbierto()"
        (click)="barra.alternarCajon()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h16" />
        </svg>
      </button>
      <a routerLink="/" class="marca-movil" aria-label="NexPlay, ir al inicio">
        <img [src]="tema.esClaro() ? 'logo-header.png' : 'logo-oscuro.png'" alt="" width="46" height="40" />
      </a>
    </header>

    @if (barra.cajonAbierto()) {
      <button
        type="button"
        class="velo"
        data-testid="velo-menu"
        aria-label="Cerrar el menú"
        (click)="barra.cerrarCajon()"
      ></button>
    }

    <div
      class="pagina"
      data-testid="shell"
      [class.con-burbuja]="muestraNiaFlotante()"
      [attr.inert]="barra.cajonAbierto() ? '' : null"
    >
      <main class="contenido">
        <router-outlet />
      </main>

      <footer class="pie">
        <app-metodologia />
      </footer>
    </div>

    @if (muestraNiaFlotante()) {
      <app-nia-flotante [attr.inert]="barra.cajonAbierto() ? '' : null" />
    }
  </div>
</div>
