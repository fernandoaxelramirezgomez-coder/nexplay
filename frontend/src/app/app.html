<div class="pagina" data-testid="shell" [class.con-burbuja]="muestraNiaFlotante()">
  <header class="cabecera">
    <a routerLink="/" class="marca" aria-label="NexPlay, ir al catálogo">
      <img src="logo-oscuro.png" alt="" width="81" height="70" />
      <span class="lema">Una segunda opinión antes de comprar tu próximo juego</span>
    </a>
    <nav class="navegacion" aria-label="Secciones">
      <a
        routerLink="/"
        routerLinkActive="activo"
        [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
        ariaCurrentWhenActive="page"
        data-testid="nav-explorar"
        >Explorar</a
      >
      <a
        routerLink="/comparar"
        [queryParams]="parametrosComparar()"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        data-testid="nav-comparar"
        >Comparar
        @if (comparar.cantidad()) {
          <span class="mono" data-testid="nav-comparar-cantidad">({{ comparar.cantidad() }})</span>
        }</a
      >
      <a routerLink="/perfil" routerLinkActive="activo" ariaCurrentWhenActive="page" data-testid="nav-perfil"
        >Tu perfil</a
      >
      <a
        routerLink="/como-funciona"
        routerLinkActive="activo"
        ariaCurrentWhenActive="page"
        data-testid="nav-como-funciona"
        >Cómo funciona</a
      >
      @if (perfil.hayPerfil()) {
        <span class="estado-perfil" data-testid="perfil-activo">Perfil activo</span>
      }
    </nav>
  </header>

  <main class="contenido">
    <router-outlet />
  </main>

  <footer class="pie">
    @if (enPortada()) {
      <app-nia-mascota />
    }
    <app-metodologia />
  </footer>

  @if (muestraNiaFlotante()) {
    <app-nia-flotante />
  }
</div>
